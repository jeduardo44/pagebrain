<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>PageBrain — Definições</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 520px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1a1a1a;
      }
      h1 { font-size: 20px; }
      label { display: block; margin: 18px 0 6px; font-weight: 600; }
      input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; }
      .hint { color: #666; font-size: 13px; margin-top: 4px; }
      button {
        margin-top: 20px;
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        background: #6d5efc;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      .danger { background: #d9534f; }
      #saved { color: #2e7d32; margin-left: 10px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>🧠 PageBrain — Definições</h1>

    <label for="backendUrl">URL do backend</label>
    <input id="backendUrl" type="text" placeholder="http://localhost:8000" />
    <div class="hint">Onde corre a API FastAPI. Por omissão <code>http://localhost:8000</code>.</div>

    <div>
      <button id="save">Guardar</button>
      <span id="saved"></span>
    </div>

    <label>Memória local</label>
    <div class="hint">Apaga o histórico de conversas e análises guardadas no browser.</div>
    <button id="clear" class="danger">Limpar tudo</button>

    <script src="options.js"></script>
  </body>
</html>
