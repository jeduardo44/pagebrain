name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check backend tests

      - name: Types (mypy)
        run: mypy backend

      - name: Tests (pytest)
        # Os testes mockam o cliente Claude — não precisam de ANTHROPIC_API_KEY.
        run: pytest -q
